
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WPM Test</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:22px 16px;
  font-family:Arial,sans-serif;
  background:#101114;color:#f5f5f5;
}
.app{max-width:520px;margin:auto}
h1{font-size:30px;margin:8px 0}
.sub{color:#9a9ba5;margin-bottom:25px}
.modes{display:flex;gap:9px;margin:18px 0}
button{
  border:1px solid #383941;border-radius:12px;
  background:#202127;color:white;padding:13px 8px;
  font-size:16px;cursor:pointer;flex:1
}
button.active,.primary{
  background:#a78bfa;color:#15121d;border-color:#a78bfa;
  font-weight:bold
}
.card{
  background:#1c1d23;border:1px solid #303139;
  border-radius:16px;padding:17px;margin:13px 0
}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#25262e;border-radius:12px;padding:12px 6px;text-align:center}
.num{font-size:23px;font-weight:bold;margin-bottom:5px}
.label{font-size:11px;color:#aaa}
#reference{font-size:18px;line-height:1.7;color:#c7b8ff}
textarea{
  width:100%;height:130px;resize:vertical;
  background:#111216;color:white;border:1px solid #454650;
  border-radius:12px;padding:13px;font-size:17px;
  line-height:1.5;outline:none
}
textarea:focus{border-color:#a78bfa}
.hint{font-size:13px;color:#aaa;line-height:1.5}
#result{display:none}
</style>
</head>
<body>
<div class="app">
  <h1>WPM TEST</h1>
  <div class="sub">Проверь скорость своей печати</div>

  <div class="hint">Время теста</div>
  <div class="modes">
    <button data-time="10" class="active">10 сек</button>
    <button data-time="30">30 сек</button>
    <button data-time="60">60 сек</button>
  </div>

  <div class="stats">
    <div class="stat"><div class="num" id="time">10</div><div class="label">СЕКУНД</div></div>
    <div class="stat"><div class="num" id="wpm">0</div><div class="label">ВПМ</div></div>
    <div class="stat"><div class="num" id="accuracy">100%</div><div class="label">ТОЧНОСТЬ</div></div>
  </div>

  <div class="card">
    <div class="hint">Печатай этот текст:</div>
    <p id="reference"></p>
    <textarea id="typing" placeholder="Нажми сюда и начинай печатать..." disabled></textarea>
    <p class="hint" id="status">Выбери время и нажми «Начать тест».</p>
    <button class="primary" id="start" style="width:100%">Начать тест</button>
  </div>

  <div class="card" id="result">
    <h2>Тест завершён!</h2>
    <div class="stats">
      <div class="stat"><div class="num" id="finalWpm">0</div><div class="label">ВПМ</div></div>
      <div class="stat"><div class="num" id="finalAcc">0%</div><div class="label">ТОЧНОСТЬ</div></div>
      <div class="stat"><div class="num" id="errors">0</div><div class="label">ОШИБКИ</div></div>
    </div>
    <button class="primary" id="again" style="width:100%;margin-top:12px">Попробовать снова</button>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

const passages = [
"Сегодня отличный день чтобы научиться чему то новому и стать немного лучше чем вчера.",
"Быстрая печать требует практики внимательности и уверенности в каждом движении пальцев.",
"Иногда самые простые решения помогают добиться результата быстрее чем долгие размышления.",
"Каждый новый день дает возможность проверить свои силы и улучшить собственные навыки.",
"Главное не торопиться слишком сильно ведь точность печати тоже имеет большое значение.",
"Успех приходит к тем кто регулярно тренируется и не боится совершать небольшие ошибки.",
"Скорость набора текста постепенно растет когда руки привыкают к расположению клавиш.",
"Попробуй сосредоточиться на тексте и печатать спокойно сохраняя правильный ритм."
];

let duration=10, text="", running=false, started=0, timer=null;

const $=id=>document.getElementById(id);
const input=$("typing");

function newText(){
  text=passages[Math.floor(Math.random()*passages.length)];
  $("reference").textContent=text;
}
function metrics(){
  const typed=input.value;
  let correct=0;
  for(let i=0;i<typed.length;i++){
    if(i<text.length && typed[i]===text[i]) correct++;
  }
  const elapsed=running?Math.max((Date.now()-started)/1000,0.1):duration;
  const wpm=Math.round((typed.length/5)/(elapsed/60));
  const accuracy=typed.length?Math.round(correct/typed.length*100):100;
  $("wpm").textContent=wpm;
  $("accuracy").textContent=accuracy+"%";
  return {wpm,accuracy,errors:typed.length-correct};
}
function finish(){
  if(!running)return;
  running=false;
  clearInterval(timer);
  input.disabled=true;
  const m=metrics();
  $("finalWpm").textContent=m.wpm;
  $("finalAcc").textContent=m.accuracy+"%";
  $("errors").textContent=m.errors;
  $("status").textContent="Время вышло! Попробуй улучшить результат.";
  $("result").style.display="block";
  $("start").textContent="Начать заново";
}
function tick(){
  const left=Math.max(0,duration-(Date.now()-started)/1000);
  $("time").textContent=left.toFixed(1);
  metrics();
  if(left<=0)finish();
}
function startTest(){
  clearInterval(timer);
  running=false;
  input.value="";
  input.disabled=false;
  $("result").style.display="none";
  $("start").textContent="Тест идёт...";
  $("start").disabled=true;
  $("status").textContent="Начни печатать — таймер запустится автоматически.";
  $("time").textContent=duration;
  $("wpm").textContent="0";
  $("accuracy").textContent="100%";
  newText();
  input.focus();
  $("start").disabled=false;
  $("start").textContent="Сбросить тест";
}
function beginClock(){
  if(running)return;
  running=true;
  started=Date.now();
  $("status").textContent="Печатай как можно быстрее!";
  timer=setInterval(tick,100);
}
document.querySelectorAll("[data-time]").forEach(btn=>{
  btn.addEventListener("click",()=>{
    if(running)return;
    duration=Number(btn.dataset.time);
    document.querySelectorAll("[data-time]").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    $("time").textContent=duration;
    $("result").style.display="none";
    $("status").textContent="Нажми «Начать тест».";
  });
});
input.addEventListener("input",()=>{
  if(!running && !input.disabled && input.value.length>0)beginClock();
  if(running)metrics();
});
$("start").addEventListener("click",()=>{
  if(running){
    clearInterval(timer);
    running=false;
    startTest();
  }else{
    startTest();
  }
});
$("again").addEventListener("click",startTest);
newText();
</script>
</body>
</html>
